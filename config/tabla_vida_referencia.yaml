# ═══════════════════════════════════════════════════════════════════════
# Tabla de vida de referencia para los Años de Vida Perdidos (AVPP / YLL).
#
# Método GBD (Global Burden of Disease): el AVPP de una muerte a la edad a es
# la esperanza de vida RESTANTE a esa edad en una tabla de vida de referencia
# —no la esperanza de vida real de Colombia—. Así el indicador es comparable
# entre países y no penaliza a un territorio por tener ya baja esperanza de
# vida. Se usa la Tabla de Vida de Referencia estándar del GBD 2019 (basada en
# la menor mortalidad observada por edad; e(0) ≈ 88,9 años).
#
# AVPP_muerte = ex_ref(edad_al_morir)
# AVPP_total  = Σ sobre las muertes
#
# Referencias
#   GBD 2019: Global Health Metrics. Lancet 396(10258), 2020.
#   WHO (2020). WHO methods and data sources for global burden of disease.
#   Murray, C. J. L., et al. (2020). Five insights from the GBD 2019.
# ═══════════════════════════════════════════════════════════════════════

# Esperanza de vida restante de referencia (años) por edad exacta. Se
# interpola linealmente para edades intermedias.
tabla_referencia_gbd:
  0:   88.87
  1:   88.00
  5:   84.03
  10:  79.05
  15:  74.07
  20:  69.11
  25:  64.15
  30:  59.20
  35:  54.25
  40:  49.32
  45:  44.43
  50:  39.63
  55:  34.91
  60:  30.25
  65:  25.68
  70:  21.28
  75:  17.13
  80:  13.30
  85:  9.99
  90:  7.25
  95:  5.06
  100: 3.41

# Edad-punto medio (en años) de cada código GRU_ED1 del microdato de
# defunciones. Verificado contra el diccionario DANE 2024. Para menores de 1
# año se usa el punto medio del intervalo en años; el código 29 (desconocida)
# se excluye del cálculo y se reporta cuántas muertes quedaron sin edad.
edad_media_gru_ed1:
  0:  0.00003     # menor de una hora
  1:  0.0014      # menor de un día
  2:  0.01        # 1-6 días
  3:  0.047       # 7-27 días
  4:  0.079       # 28-29 días
  5:  0.25        # 1-5 meses
  6:  0.71        # 6-11 meses
  7:  1.5         # 1 año
  8:  3.0         # 2-4 años
  9:  7.0         # 5-9
  10: 12.0        # 10-14
  11: 17.0        # 15-19
  12: 22.0        # 20-24
  13: 27.0        # 25-29
  14: 32.0        # 30-34
  15: 37.0        # 35-39
  16: 42.0        # 40-44
  17: 47.0        # 45-49
  18: 52.0        # 50-54
  19: 57.0        # 55-59
  20: 62.0        # 60-64
  21: 67.0        # 65-69
  22: 72.0        # 70-74
  23: 77.0        # 75-79
  24: 82.0        # 80-84
  25: 87.0        # 85-89
  26: 92.0        # 90-94
  27: 97.0        # 95-99
  28: 102.0       # 100 y más
codigo_edad_desconocida: 29
